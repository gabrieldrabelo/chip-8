[package]
name = "chip8"
version = "0.1.0"
edition = "2024"

[features]
default = ["desktop"]
desktop = ["dep:clap", "dep:minifb", "dep:rodio"]

[[bin]]
name = "chip8"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
minifb = { version = "0.28.0", optional = true }
rodio = { version = "0.22.2", optional = true }
